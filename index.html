<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ctf.rarebytehub.com - Temporarily Down</title>
<style>
  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
  }
  h1 { font-size: 1.8rem; }
  #count {
    font-size: 3rem;
    color: #58a6ff;
    margin-top: 10px;
  }
  a { color: #58a6ff; }
</style>
</head>
<body>
  <h1>ctf.rarebytehub.com is temporarily down</h1>
  <p>Redirecting you to our Telegram group in <span id="count">3</span> seconds...</p>
  <p>If not redirected, <a href="https://t.me/rarebytehub">click here</a>.</p>

  <script>
    let seconds = 3;
    const countEl = document.getElementById('count');
    const timer = setInterval(() => {
      seconds--;
      countEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = "https://t.me/rarebytehub";
      }
    }, 1000);
  </script>
</body>
</html>
